 document.addEventListener('click',function(e){
   const b=e.target.closest('button'); if(!b)return;
   if(b.textContent.replace(/\s+/g,' ').trim()==='AI 추천 받기'){

   }
 },true);
 window.addEventListener('hashchange',renderCurrent);
